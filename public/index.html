<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕專屬：線上煙火大會</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h1>✨ 星空煙火大會 ✨</h1>
            <p>與心愛的人進入專屬夜空</p>
            <input type="text" id="room-input" placeholder="設定專屬房間密碼 (如 0819)" autocomplete="off">
            <input type="text" id="nickname-input" placeholder="輸入你的專屬暱稱..." autocomplete="off">
            
            <div class="role-selector" style="margin-bottom: 20px; text-align: left;">
                <p style="margin-bottom: 10px; font-size: 13px;">我想當：</p>
                <div class="style-buttons role-buttons">
                    <button class="role-btn active" data-role="hamster">倉鼠 🐹</button>
                    <button class="role-btn" data-role="capybara">卡皮巴拉 🦦</button>
                </div>
            </div>

            <div class="style-selector">
                <p>初始夜空風格：</p>
                <div class="style-buttons">
                    <button class="style-btn active" data-style="anime">動畫浪漫風</button>
                    <button class="style-btn" data-style="pixel">可愛像素風</button>
                </div>
            </div>
            
            <button id="join-btn">進入星空</button>
        </div>
    </div>

    <div id="main-container">
        <picture id="bg-picture">
            <source media="(orientation: portrait)" srcset="assets/anime_9x16.jpg" id="bg-source-portrait">
            <img src="assets/anime_16x9.jpg" id="bg-img-landscape" alt="background">
        </picture>
        
        <canvas id="fireworks-canvas"></canvas>
        <div id="ui-layer">
            <div class="controls">
                <button id="toggle-style-btn">切換風格</button>
            </div>
            <div id="toast-container"></div>
            <div id="names-container"></div>
            
            <div id="chat-container" style="display: none;">
                <input type="text" id="chat-input" placeholder="說點浪漫的話..." autocomplete="off">
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
